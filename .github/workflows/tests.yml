name: Tests

# Test the newest versioned package in this checkout; no version edit is needed.
# Hardware timing and display appearance still require physical acceptance.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check workflow helpers
        run: python3 .github/scripts/test_package_workflows.py
      - name: Select current package
        id: package
        run: python3 .github/scripts/package_target.py
      - name: Install clang, Octave and numpy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libomp-dev octave octave-dev python3-dev python3-numpy
      - name: Run the suite
        env:
          PACKAGE_DIR: ${{ steps.package.outputs.package_dir }}
        run: python3 "$PACKAGE_DIR/tests/run_tests.py"

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Ensure the Metal compiler is available
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Select current package
        id: package
        run: python .github/scripts/package_target.py
      - run: python -m pip install numpy
      - name: Build the engine and the Python front end
        env:
          PACKAGE_DIR: ${{ steps.package.outputs.package_dir }}
        run: make -C "$PACKAGE_DIR" python PYTHON=python
      - name: Run software checks (media hardware fixtures excluded)
        env:
          PACKAGE_DIR: ${{ steps.package.outputs.package_dir }}
        run: python "$PACKAGE_DIR/tests/run_tests.py" --skip-media-fixtures
