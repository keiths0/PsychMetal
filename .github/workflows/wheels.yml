name: Wheels

# Builds psychmetal wheels for every supported Python on Apple silicon, plus a
# source distribution. A manual run (Actions tab -> Wheels -> Run workflow) only
# builds, to check; pushing a tag such as v0.5.0 also publishes to PyPI.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  PACKAGE_DIR: PsychMetal-0.5.0

jobs:
  wheels:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install cibuildwheel
      - run: python -m cibuildwheel "$PACKAGE_DIR" --output-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: wheelhouse/*.whl

  sdist:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          grep -qx "version = \"${GITHUB_REF_NAME#v}\"" "$PACKAGE_DIR/pyproject.toml" ||
            { echo "Tag $GITHUB_REF_NAME does not match the version in $PACKAGE_DIR/pyproject.toml"; exit 1; }
      - run: python -m pip install build && python -m build --sdist "$PACKAGE_DIR" --outdir dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
